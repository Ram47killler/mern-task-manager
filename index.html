<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - Minor Project</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
    <h1 class="text-2xl font-bold text-white mb-4 flex items-center gap-2">
      📌 My Task Manager
    </h1>

    <!-- Input Form -->
    <form id="taskForm" class="flex gap-2 mb-4">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Enter task..." 
        required 
        class="flex-1 px-4 py-2 bg-gray-700 text-white placeholder-gray-400 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <button 
        type="submit" 
        class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg transition"
      >
        Add
      </button>
    </form>

    <!-- Filter Buttons -->
    <div class="flex justify-between mb-4 border-b border-gray-700 pb-2 text-sm">
      <button id="filterAll" class="filter-btn font-bold text-blue-400" onclick="setFilter('all')">All</button>
      <button id="filterPending" class="filter-btn text-gray-400 hover:text-blue-400" onclick="setFilter('pending')">Pending</button>
      <button id="filterCompleted" class="filter-btn text-gray-400 hover:text-blue-400" onclick="setFilter('completed')">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
